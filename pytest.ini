[pytest]
testpaths = .
pythonpath = src
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# DeepEval 4.2.6 registers a pytest plugin that imports optional providers
# (google.genai, ollama, llama-index). Disable it so the suite does not
# require those extras or upgrade the frozen RAGAS stack.
addopts = -p no:deepeval -m "not live"
markers =
    live: calls a live RAG or LLM provider
